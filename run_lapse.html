<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>HR Repair +21625733379 PS4 Host</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #03060b;

    color: #eef6ff;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =====================================================
   LOGO BACKGROUND
   ===================================================== */

.mark {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    margin: 0;

    border: none;

    border-radius: 0;

    background: #03060b;

    box-shadow: none;

    overflow: hidden;

    z-index: 0;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =====================================================
   LOGO
   FULL SCREEN
   NO CROP
   ===================================================== */

.brand-logo {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: block;

    /*
       الصورة تظهر كاملة بدون قص
       مع الحفاظ على الأبعاد الأصلية
    */

    object-fit: contain;

    object-position: center center;

    border-radius: 0;

    background: #03060b;
}


/* =====================================================
   OVERLAY
   ===================================================== */

.mark::after {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,0.08) 0%,
            rgba(0,0,0,0.12) 50%,
            rgba(0,0,0,0.22) 100%
        );

    pointer-events: none;
}


/* =====================================================
   BACKGROUND EFFECT
   ===================================================== */

body:before {

    content: "";

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 36%,
            rgba(0,126,255,.08),
            transparent 36%
        );

    z-index: -1;

    pointer-events: none;
}


/* =====================================================
   MAIN
   ===================================================== */

.shell {

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 28px;

    position: relative;

    z-index: 2;
}


/* =====================================================
   CARD
   ===================================================== */

.card {

    width: min(760px,92vw);

    text-align: center;

    background:
        rgba(3,6,11,0.60);

    backdrop-filter: blur(6px);

    -webkit-backdrop-filter: blur(6px);

    border-radius: 32px;

    padding:
        30px
        24px
        40px;

    border:
        1px solid
        rgba(72,164,255,0.15);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,0.80);
}


/* =====================================================
   BRAND
   ===================================================== */

.brand {

    font-size: 27px;

    font-weight: 800;

    letter-spacing: .18em;

    margin-left: .18em;

    color: #ffffff;

    text-shadow:
        0 0 15px
        rgba(58,158,255,0.55),

        0 0 30px
        rgba(58,158,255,0.30);
}


.sub {

    margin-top: 5px;

    color: #7390ad;

    font-size: 11px;

    letter-spacing: .30em;

    text-transform: uppercase;
}


/* =====================================================
   STAGE
   ===================================================== */

.stage {

    margin: 42px auto 0;

    max-width: 560px;
}


#state {

    font-size: 19px;

    font-weight: 650;

    margin-bottom: 18px;

    color: #e8c66f;

    animation:
        pulse 1.35s
        ease-in-out
        infinite;
}


/* =====================================================
   PROGRESS
   ===================================================== */

.track {

    height: 5px;

    background:
        rgba(16,26,38,0.90);

    border-radius: 99px;

    overflow: hidden;

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,0.025);
}


.flow {

    height: 100%;

    width: 34%;

    border-radius: 99px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #38a7ff,
            #8ad6ff,
            transparent
        );

    animation:
        flow 1.15s
        linear
        infinite;

    box-shadow:
        0 0 15px
        rgba(56,167,255,0.65);
}


/* =====================================================
   OUTPUT
   ===================================================== */

#out {

    position: fixed;

    left: -9999px;
    top: -9999px;

    width: 1px;
    height: 1px;

    overflow: hidden;

    white-space: pre-wrap;
}


/* =====================================================
   HINT
   ===================================================== */

.hint {

    margin-top: 13px;

    color: #52677d;

    font-size: 11px;

    letter-spacing: .12em;
}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    position: fixed;

    left: 0;
    right: 0;

    bottom: 20px;

    text-align: center;

    color:
        rgba(255,255,255,0.65);

    font-size: 10px;

    letter-spacing: .22em;

    z-index: 3;

    background:
        rgba(3,6,11,0.35);

    padding: 8px 0;

    backdrop-filter: blur(3px);

    -webkit-backdrop-filter: blur(3px);
}


/* =====================================================
   STATES
   ===================================================== */

.ok {
    color: #62d69a !important;
}

.bad {
    color: #ef8d82 !important;
}

.warn {
    color: #e8c66f !important;
}


/* =====================================================
   ANIMATIONS
   ===================================================== */

@keyframes pulse {

    50% {
        opacity: .5;
    }

}


@keyframes flow {

    from {
        transform: translateX(-110%);
    }

    to {
        transform: translateX(310%);
    }

}


/* =====================================================
   SMALL SCREEN
   ===================================================== */

@media (max-width: 600px) {

    .shell {

        padding: 15px;
    }


    .card {

        width: 94vw;

        padding:
            25px
            18px
            32px;

        border-radius: 24px;
    }


    .brand {

        font-size: 24px;
    }


    .stage {

        margin-top: 32px;
    }


    #state {

        font-size: 17px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGO FULL SCREEN BACKGROUND
     ===================================================== -->

<div class="mark">

    <img
        src="logo.png"
        alt="HR Repair +21625733379"
        class="brand-logo"
    >

</div>


<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<div class="shell">

    <main class="card">


        <div class="brand">
            HR Repair +21625733379
        </div>


        <div class="sub">
            PS4 HOST
        </div>


        <section class="stage">


            <div id="state">
                Loading PS4 modification...
            </div>


            <div class="track">

                <div class="flow"></div>

            </div>


            <div class="hint">
                Please wait • Do not close the browser
            </div>


        </section>


        <div id="out"></div>


    </main>

</div>


<!-- =====================================================
     FOOTER
     ===================================================== -->

<div class="footer">

    HR Repair +21625733379

</div>


<!-- =====================================================
     CHAIN LAPSE
     ===================================================== -->

<script type="module">

import "./chain_lapse.js";

</script>


</body>

</html>
