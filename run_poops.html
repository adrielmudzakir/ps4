<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>HR Repair +21625733379 PS4 Host</title>

    <style>
        /* =====================================================
           RESET & BASE
           ===================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0e17;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e8edf5;
        }

        /* =====================================================
           BACKGROUND - FULL SCREEN, NO OVERLAY
           ===================================================== */
        .bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: #0a0e17;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            object-position: center;
            filter: none;
            opacity: 1;
        }

        /* =====================================================
           MAIN LAYOUT
           ===================================================== */
        .shell {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* =====================================================
           CARD
           ===================================================== */
        .card {
            width: min(520px, 92vw);
            padding: 36px 32px 32px;
            text-align: center;
            background: rgba(10, 14, 23, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        /* =====================================================
           BRAND
           ===================================================== */
        .brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #ffffff;
            line-height: 1.2;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .brand span {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sub {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

        /* =====================================================
           STAGE
           ===================================================== */
        .stage {
            margin-top: 30px;
        }

        /* =====================================================
           STATUS
           ===================================================== */
        #state {
            font-size: 15px;
            font-weight: 550;
            letter-spacing: 0.02em;
            margin-bottom: 18px;
            color: #fcd34d;
            min-height: 28px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
        }

        .pulse {
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        /* =====================================================
           PROGRESS BAR
           ===================================================== */
        .track {
            width: 100%;
            height: 5px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .flow {
            height: 100%;
            width: 34%;
            border-radius: 99px;
            background: linear-gradient(90deg, transparent, #3b82f6, #8b5cf6, #ec4899, transparent);
            animation: flow 1.2s linear infinite;
            box-shadow: 0 0 24px rgba(59, 130, 246, 0.25);
        }

        @keyframes flow {
            from {
                transform: translateX(-110%);
            }
            to {
                transform: translateX(310%);
            }
        }

        /* =====================================================
           HINT
           ===================================================== */
        .hint {
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }

        /* =====================================================
           LOGS - مخفية تماماً
           ===================================================== */
        #out {
            display: none !important;
        }

        /* =====================================================
           FOOTER
           ===================================================== */
        .footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 18px;
            z-index: 3;
            text-align: center;
            font-size: 10px;
            font-weight: 450;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */
        @media (max-width: 600px) {
            .card {
                padding: 28px 20px 26px;
                border-radius: 24px;
            }
            .brand {
                font-size: 18px;
            }
            #state {
                font-size: 14px;
            }
        }

        @media (max-height: 600px) {
            .card {
                padding: 20px 18px 18px;
            }
            .stage {
                margin-top: 18px;
            }
            #state {
                margin-bottom: 12px;
            }
            .footer {
                bottom: 10px;
            }
        }
    </style>

</head>

<body>

    <!-- =====================================================
         BACKGROUND IMAGE
         ===================================================== -->
    <div class="bg">
        <img src="logo.png" alt="HR Repair +21625733379">
    </div>

    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->
    <div class="shell">
        <main class="card">

            <div class="brand">
                HR <span>Repair</span> +21625733379
            </div>

            <div class="sub">
                PS4 HOST
            </div>

            <section class="stage">
                <div id="state" class="pulse">Loading PS4 modification…</div>

                <div class="track">
                    <div class="flow"></div>
                </div>

                <div class="hint">Please wait • Do not close the browser</div>
            </section>

            <!-- مخفي تماماً -->
            <div id="out"></div>

        </main>
    </div>

    <!-- =====================================================
         FOOTER
         ===================================================== -->
    <div class="footer">HR Repair +21625733379</div>

    <!-- =====================================================
         SCRIPT
         ===================================================== -->
    <script type="module">
        import "./chain_poops.js";
    </script>

</body>

</html>
